# Banco H2 em memória — sem precisar de MySQL rodando
spring.datasource.url=jdbc:h2:mem:protoserv_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none

# Flyway lê as migrations normais
spring.flyway.url=jdbc:h2:mem:protoserv_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.flyway.user=sa
spring.flyway.password=
spring.flyway.locations=classpath:db/migration

# JWT (mesma chave do application.properties)
api.security.token.secret=protoserv-chave-secreta-muito-longa-e-segura-para-assinatura-jwt-2026

# Desabilita e-mail nos testes
spring.mail.host=localhost
spring.mail.port=3025
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
